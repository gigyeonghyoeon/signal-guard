<!DOCTYPE html>
<html lang="ko" data-base="./">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal Guard — 산출물 · 주간 보고</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="발표/deck.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">
      <div class="lamps" aria-hidden="true">
        <i class="lamp red"></i><i class="lamp amber"></i><i class="lamp green"></i>
      </div>
      <div>
        <strong>Signal Guard</strong>
        <span>실시간 교통신호 상태정보 오류검지</span>
      </div>
    </a>
    <div class="meta">조찬희 · 기경현</div>
  </header>

  <div class="hub">
    <p class="eyebrow">Signal Guard</p>
    <h1>산출물 · 주간 보고</h1>
    <p class="lead">목록을 누르면 해당 산출물 원문 또는 그 주 발표가 열립니다.</p>

    <section class="hub-section">
      <p class="eyebrow">Deliverables</p>
      <h2>단계별 산출물</h2>
      <div id="doc-catalog"></div>
    </section>

    <section class="hub-section">
      <p class="eyebrow">Weekly reports</p>
      <h2>주차별 발표 자료</h2>
      <ul class="hub-list" id="week-catalog"></ul>
    </section>
  </div>

  <script src="발표/vendor/marked.min.js"></script>
  <script src="발표/docs.js"></script>
  <script src="발표/deck.js"></script>
  <script>
    (function () {
      const box = document.getElementById("doc-catalog");
      let phase = "";
      let list = null;
      SG_DOCS.forEach(function (doc) {
        if (doc.phase !== phase) {
          phase = doc.phase;
          const h = document.createElement("p");
          h.className = "hub-phase";
          h.textContent = phase;
          box.appendChild(h);
          list = document.createElement("ul");
          list.className = "hub-list";
          box.appendChild(list);
        }
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.innerHTML = "<b>" + doc.title + "</b>";
        btn.addEventListener("click", function () { SG.openDoc(doc.id); });
        li.appendChild(btn);
        list.appendChild(li);
      });

      const weeks = document.getElementById("week-catalog");
      SG_WEEKS.forEach(function (w) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = w.href;
        a.innerHTML = "<b>" + w.week + " " + w.title + "</b><span>" + w.note + "</span>";
        li.appendChild(a);
        weeks.appendChild(li);
      });

      const h = location.hash.replace("#", "");
      if (h.startsWith("doc=")) SG.openDoc(decodeURIComponent(h.slice(4)));

      window.addEventListener("keydown", function (e) {
        if (e.key === "Escape") SG.closeDoc();
      });
    })();
  </script>
</body>
</html>
