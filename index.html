<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal Guard — 3주차 주간 보고</title>
  <meta name="description" content="Signal Guard 3주차 주간 보고. 분석 산출물 5종 작성 결과, 작성 방식, 다음 주 설계 계획." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #070b14;
      --panel: #10182a;
      --line: #243044;
      --text: #eef3fb;
      --muted: #8b9bb4;
      --red: #ef4444;
      --amber: #f59e0b;
      --green: #22c55e;
      --blue: #5b8def;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    body { overflow: hidden; }

    .stage {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .lamps {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 4px 6px;
      background: #05080f;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .lamp {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .lamp.red { background: var(--red); }
    .lamp.amber { background: var(--amber); }
    .lamp.green { background: var(--green); }

    .brand strong { font-size: 15px; letter-spacing: 0.04em; }
    .brand span { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }

    .meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 16px;
    }

    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 48px 64px 72px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .slide.active { display: flex; }

    .slide-inner { width: min(1080px, 100%); margin: 0 auto; }

    .slide-inner > h1 { margin-bottom: 80px; }

    .slide-cover.active {
      display: flex;
    }

    .slide-cover .slide-inner {
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      gap: clamp(24px, 3.4vw, 48px);
      width: fit-content;
      max-width: 100%;
    }

    .cover-title { flex: 0 1 auto; min-width: 0; }

    .cover-mark {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 1px solid var(--line);
      padding-left: clamp(22px, 3vw, 44px);
      user-select: none;
    }

    .cover-mark .name {
      font-size: clamp(40px, 6.4vw, 92px);
      font-weight: 800;
      line-height: 0.94;
      letter-spacing: -0.05em;
    }

    .cover-mark .sub {
      margin-top: 20px;
      font-size: clamp(13px, 1.5vw, 18px);
      color: var(--muted);
      letter-spacing: 0.04em;
      line-height: 1.5;
    }

    kbd {
      font-family: inherit;
      font-size: 11px;
      border: 1px solid var(--line);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--muted);
    }

    h1 {
      font-size: clamp(32px, 5vw, 56px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    h2 {
      font-size: clamp(26px, 3.4vw, 40px);
      line-height: 1.25;
      letter-spacing: -0.03em;
      margin-bottom: 28px;
    }

    .eyebrow {
      color: var(--amber);
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .lead {
      margin-top: 20px;
      font-size: 22px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 42em;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }

    .chip {
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
    }

    .chip.ok { border-color: #1d4a32; color: #86efac; }
    .chip.wait { border-color: #5b3d12; color: #fcd34d; }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid.two { grid-template-columns: 1fr 1fr; }
    .grid.three { grid-template-columns: 1fr 1fr 1fr; }
    .grid.four { grid-template-columns: repeat(4, 1fr); }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 18px 16px;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .card p, .card li {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .card ol, .card ul { padding-left: 18px; }

    .stat {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .stat small {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 8px 0 22px;
    }

    .flow-step {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      position: relative;
    }

    .flow-step b { display: block; font-size: 18px; margin-bottom: 6px; }
    .flow-step span { color: var(--muted); font-size: 13px; line-height: 1.45; }

    .note {
      color: var(--muted);
      font-size: 16px;
    }

    .note strong { color: var(--text); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th { color: var(--muted); font-weight: 500; font-size: 13px; }

    footer.bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 28px 14px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }

    .progress {
      flex: 1;
      height: 3px;
      background: #1b2436;
      margin: 0 20px;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress > i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--amber);
    }

    .nav-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }

    .nav-btn:hover { border-color: #3b4d6b; }

    .hint { font-size: 12px; color: var(--muted); min-width: 140px; }

    .cover-team { margin-top: 36px; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .cover-team b { color: var(--text); }

    .chain {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 4px 0 22px;
    }

    .chain b {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 650;
    }

    .chain i {
      color: var(--muted);
      font-style: normal;
      font-size: 12px;
    }

    .owner { color: var(--amber); font-size: 12px; font-weight: 500; }

    @media (max-width: 900px) {
      .slide { padding: 28px 20px 56px; }
      header, footer.bar { padding-left: 16px; padding-right: 16px; }
      .grid.two, .grid.three, .grid.four, .flow { grid-template-columns: 1fr; }
      .meta { display: none; }
      .lead { font-size: 18px; }
    }

    @media (max-width: 560px) {
      .slide-cover .slide-inner {
        flex-wrap: wrap;
        row-gap: 24px;
      }

      .cover-mark {
        border-left: none;
        border-top: 1px solid var(--line);
        padding: 20px 0 0;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <header>
      <a class="brand" href="#1">
        <div class="lamps" aria-hidden="true">
          <i class="lamp red"></i>
          <i class="lamp amber"></i>
          <i class="lamp green"></i>
        </div>
        <div>
          <strong>Signal Guard</strong>
          <span>실시간 교통신호 상태정보 오류검지</span>
        </div>
      </a>
      <div class="meta">
        <span>3주차 주간 보고</span>
        <span>조찬희 · 기경현</span>
      </div>
    </header>

    <main id="deck"></main>

    <footer class="bar">
      <button class="nav-btn" id="prev" type="button">이전</button>
      <div class="progress"><i id="bar"></i></div>
      <div class="hint"><span id="pos">1</span> / <span id="total">8</span> · 방향키</div>
      <button class="nav-btn" id="next" type="button">다음</button>
    </footer>
  </div>

  <template id="slides">
    <section class="slide slide-cover" data-title="표지">
      <div class="slide-inner">
        <div class="cover-title">
          <p class="eyebrow">Week 3 · Weekly Report</p>
          <h1>3주차 주간 보고</h1>
          <p class="lead">이번 주는 분석 단계의 마무리 단계<br />다음 주는 화면·구조 설계 시작</p>
          <div class="chips">
            <span class="chip ok">분석 단계</span>
          </div>
          <p class="cover-team">
            <b>조찬희</b> 기획·PM · <b>기경현</b> 백엔드·데이터<br />
            기간 1–3주 · 보고일 2026.09.14
          </p>
        </div>
        <div class="cover-mark">
          <div class="name">Signal<br />Guard</div>
          <p class="sub">실시간 교통신호 상태정보<br />오류검지 시스템</p>
        </div>
      </div>
    </section>

    <section class="slide" data-title="산출물">
      <div class="slide-inner">
        <p class="eyebrow">Deliverables</p>
        <h2>이번에 작성한 것</h2>
        <table>
          <thead>
            <tr>
              <th>산출물</th>
              <th>역할</th>
              <th>규모</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>프로젝트정의서</td>
              <td>왜 만드는가, 범위, 데이터에 대한 정의</td>
              <td>수업 MVP</td>
            </tr>
            <tr>
              <td>제안요청서 요구사항 대응표</td>
              <td>공단 요청 39건을 수업에서 어디에 붙일지</td>
              <td>구현 7 / 부분 17 </td>
            </tr>
            <tr>
              <td>요구사항정의서</td>
              <td>무엇을 만들지, 테스트로 가릴 기준</td>
              <td>기능·비기능 요구</td>
            </tr>
            <tr>
              <td>유스케이스·사용자 스토리</td>
              <td>누가, 어떤 흐름으로 사용할지</td>
              <td>흐름 11개 · 구현 단위 33개</td>
            </tr>
            <tr>
              <td>제품 백로그 · WBS</td>
              <td>언제, 누가, 몇 주에 할 작업 내용</td>
              <td>15주 작업 목록</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="slide" data-title="작성 방식">
      <div class="slide-inner">
        <p class="eyebrow">How we wrote</p>
        <h1>작성 방법</h1>
        <div class="grid two">
          <div class="card">
            <h3>작성 원칙</h3>
            <ul>
              <li>요구사항 별로 ID를 부여, 정의</li>
              <li>요구사항에 통과 기준 정의</li>
              <li>제안요청서의 내용을 토대로 요구사항을 연결</li>
            </ul>
          </div>
          <div class="card">
            <h3>구현을 위한 범위 정의</h3>
            <ul>
              <li>신호 데이터는 인천시 데이터로 제한</li>
              <li>제안요청서 중 실제 개발 범위 정의</li>
              <li>수업범위 내에서 산출물 정의</li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <section class="slide" data-title="문서별">
      <div class="slide-inner">
        <p class="eyebrow">Per document</p>
        <h2>작성된 산출물</h2>
        <div class="grid two">
          <div class="card">
            <h3>프로젝트정의서</h3>
            <p>공단 제안요청서를 수업 범위로 줄였다. 신호 데이터 수집→검지→관제→통제, 실시간 API와 계획 데이터의 대조를 통한 오류 감지</p>
          </div>
          <div class="card">
            <h3>제안요청서 대응표</h3>
            <p>요청 39건중 구현부분과 구현 불가능한 부분을 분리 구현하는 부분은 24건</p>
          </div>
          <div class="card">
            <h3>요구사항정의서</h3>
            <p>무엇을 만들지 ID로 쪼개고, 테스트로 통과·실패를 가릴 수 있게 적었다. 통제는 정보·계획·현장 요청으로 나눴다.</p>
          </div>
          <div class="card">
            <h3>유스케이스 · 백로그</h3>
            <p>흐름 11개, 구현 단위 33개로 나눴다. 백로그를 15주 일정에 따라 분배</p>
          </div>
        </div>
      </div>
    </section>

    <section class="slide" data-title="다음 주">
      <div class="slide-inner">
        <p class="eyebrow">Next week · 4주차</p>
        <h2>다음주 할일</h2>
        <table>
          <thead>
            <tr>
              <th>할 일</th>
              <th>담당</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>프론트·백엔드 스택 확정, 시스템 구성도</td>
              <td>공동</td>
            </tr>
            <tr>
              <td>표본 교차로 수 × 수집 주기 × 보관</td>
              <td>기경현</td>
            </tr>
            <tr>
              <td>필수 화면 IA · 와이어</td>
              <td>조찬희</td>
            </tr>
            <tr>
              <td>개념·논리 ERD</td>
              <td>기경현</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="slide" data-title="5주차">
      <div class="slide-inner">
        <p class="eyebrow">After next week · 5주차</p>
        <h2>설계 단계에서 나올 산출물</h2>
        <div class="grid two">
          <div class="card">
            <h3>API 명세서</h3>
            <p>화면이 서버에 무엇을 요청하는지 적어 둔다.</p>
          </div>
          <div class="card">
            <h3>검증 규칙 명세서</h3>
            <p>어떤 신호를 오류로 볼지 규칙을 적는다.</p>
          </div>
          <div class="card">
            <h3>화면 프로토타입</h3>
            <p>대시보드·이슈·교차로 상세를 클릭해 보게 만든다.</p>
          </div>
          <div class="card">
            <h3>설계 리뷰</h3>
            <p>4–5주 설계를 한 번 점검하고 구현으로 넘어간다.</p>
          </div>
        </div>
      </div>
    </section>
  </template>

  <script>
    const deck = document.getElementById("deck");
    const tpl = document.getElementById("slides");
    const slides = Array.from(tpl.content.querySelectorAll(".slide"));
    slides.forEach((s) => deck.appendChild(s));

    let i = 0;
    const total = slides.length;
    document.getElementById("total").textContent = String(total);

    function go(n) {
      i = Math.max(0, Math.min(total - 1, n));
      slides.forEach((s, idx) => s.classList.toggle("active", idx === i));
      document.getElementById("pos").textContent = String(i + 1);
      document.getElementById("bar").style.width = ((i + 1) / total) * 100 + "%";
      history.replaceState(null, "", "#" + (i + 1));
    }

    function fromHash() {
      const n = parseInt(location.hash.replace("#", ""), 10);
      go(Number.isFinite(n) ? n - 1 : 0);
    }

    document.getElementById("prev").onclick = () => go(i - 1);
    document.getElementById("next").onclick = () => go(i + 1);

    window.addEventListener("keydown", (e) => {
      if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) {
        e.preventDefault();
        go(i + 1);
      }
      if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) {
        e.preventDefault();
        go(i - 1);
      }
      if (e.key === "Home") go(0);
      if (e.key === "End") go(total - 1);
    });

    let touchX = null;
    window.addEventListener("touchstart", (e) => { touchX = e.changedTouches[0].clientX; });
    window.addEventListener("touchend", (e) => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (dx < -40) go(i + 1);
      if (dx > 40) go(i - 1);
      touchX = null;
    });

    window.addEventListener("hashchange", fromHash);
    fromHash();
  </script>
</body>
</html>
