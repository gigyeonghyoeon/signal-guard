<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal Guard — 3주차 주간 보고</title>
  <meta name="description" content="Signal Guard 3주차 주간 보고. 분석 산출물 5종 작성 결과, 작성 방식, 다음 주 설계 계획." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #070b14;
      --panel: #10182a;
      --line: #243044;
      --text: #eef3fb;
      --muted: #8b9bb4;
      --red: #ef4444;
      --amber: #f59e0b;
      --green: #22c55e;
      --blue: #5b8def;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    body { overflow: hidden; }

    .stage {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .lamps {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 4px 6px;
      background: #05080f;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .lamp {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .lamp.red { background: var(--red); }
    .lamp.amber { background: var(--amber); }
    .lamp.green { background: var(--green); }

    .brand strong { font-size: 15px; letter-spacing: 0.04em; }
    .brand span { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }

    .meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 16px;
    }

    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 48px 64px 72px;
      display: none;
      align-items: center;
    }

    .slide.active { display: flex; }

    .slide-inner { width: min(1080px, 100%); }

    kbd {
      font-family: inherit;
      font-size: 11px;
      border: 1px solid var(--line);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--muted);
    }

    h1 {
      font-size: clamp(32px, 5vw, 56px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    h2 {
      font-size: clamp(26px, 3.4vw, 40px);
      line-height: 1.25;
      letter-spacing: -0.03em;
      margin-bottom: 28px;
    }

    .eyebrow {
      color: var(--amber);
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .lead {
      margin-top: 20px;
      font-size: 22px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 42em;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }

    .chip {
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
    }

    .chip.ok { border-color: #1d4a32; color: #86efac; }
    .chip.wait { border-color: #5b3d12; color: #fcd34d; }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid.two { grid-template-columns: 1fr 1fr; }
    .grid.three { grid-template-columns: 1fr 1fr 1fr; }
    .grid.four { grid-template-columns: repeat(4, 1fr); }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 18px 16px;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .card p, .card li {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .card ol, .card ul { padding-left: 18px; }

    .stat {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .stat small {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 8px 0 22px;
    }

    .flow-step {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      position: relative;
    }

    .flow-step b { display: block; font-size: 18px; margin-bottom: 6px; }
    .flow-step span { color: var(--muted); font-size: 13px; line-height: 1.45; }

    .note {
      color: var(--muted);
      font-size: 16px;
    }

    .note strong { color: var(--text); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th { color: var(--muted); font-weight: 500; font-size: 13px; }

    footer.bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 28px 14px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }

    .progress {
      flex: 1;
      height: 3px;
      background: #1b2436;
      margin: 0 20px;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress > i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--amber);
    }

    .nav-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }

    .nav-btn:hover { border-color: #3b4d6b; }

    .hint { font-size: 12px; color: var(--muted); min-width: 140px; }

    .cover-team { margin-top: 36px; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .cover-team b { color: var(--text); }

    .chain {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 4px 0 22px;
    }

    .chain b {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 650;
    }

    .chain i {
      color: var(--muted);
      font-style: normal;
      font-size: 12px;
    }

    .owner { color: var(--amber); font-size: 12px; font-weight: 500; }

    @media (max-width: 900px) {
      .slide { padding: 28px 20px 56px; }
      header, footer.bar { padding-left: 16px; padding-right: 16px; }
      .grid.two, .grid.three, .grid.four, .flow { grid-template-columns: 1fr; }
      .meta { display: none; }
      .lead { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <header>
      <a class="brand" href="#1">
        <div class="lamps" aria-hidden="true">
          <i class="lamp red"></i>
          <i class="lamp amber"></i>
          <i class="lamp green"></i>
        </div>
        <div>
          <strong>Signal Guard</strong>
          <span>실시간 교통신호 상태정보 오류검지</span>
        </div>
      </a>
      <div class="meta">
        <span>3주차 주간 보고</span>
        <span>조찬희 · 기경현</span>
      </div>
    </header>

    <main id="deck"></main>

    <footer class="bar">
      <button class="nav-btn" id="prev" type="button">이전</button>
      <div class="progress"><i id="bar"></i></div>
      <div class="hint"><span id="pos">1</span> / <span id="total">8</span> · 방향키</div>
      <button class="nav-btn" id="next" type="button">다음</button>
    </footer>
  </div>

  <template id="slides">
    <section class="slide" data-title="표지">
      <div class="slide-inner">
        <p class="eyebrow">Week 3 · Weekly Report</p>
        <h1>3주차 주간 보고</h1>
        <p class="lead">이번 주는 분석 문서를 다 썼다.<br />다음 주는 화면·구조 설계다.</p>
        <div class="chips">
          <span class="chip ok">분석 문서 5종 작성</span>
          <span class="chip wait">다음 주에 정할 것 있음</span>
        </div>
        <p class="cover-team">
          Signal Guard · 실시간 교통신호 상태정보 오류검지<br />
          <b>조찬희</b> 기획·PM · <b>기경현</b> 백엔드·데이터<br />
          기간 1–3주 · 보고일 2026.09.13
        </p>
      </div>
    </section>

    <section class="slide" data-title="산출물">
      <div class="slide-inner">
        <p class="eyebrow">Deliverables</p>
        <h2>이번에 작성한 것</h2>
        <table>
          <thead>
            <tr>
              <th>산출물</th>
              <th>역할</th>
              <th>규모</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>프로젝트정의서</td>
              <td>왜 만드는가, 범위, 데이터</td>
              <td>수업 MVP · 인천</td>
            </tr>
            <tr>
              <td>제안요청서 요구사항 대응표</td>
              <td>공단 요청 39건을 수업에서 어디에 붙일지</td>
              <td>구현 7 / 부분 17 / 문서만 15</td>
            </tr>
            <tr>
              <td>요구사항정의서</td>
              <td>무엇을 만들지, 테스트로 가릴 기준</td>
              <td>기능·비기능 요구</td>
            </tr>
            <tr>
              <td>유스케이스·사용자 스토리</td>
              <td>누가, 어떤 흐름으로</td>
              <td>흐름 11개 · 구현 단위 33개</td>
            </tr>
            <tr>
              <td>제품 백로그 · WBS</td>
              <td>언제, 누가, 몇 주</td>
              <td>15주 작업 목록</td>
            </tr>
          </tbody>
        </table>
        <p class="note" style="margin-top:18px;">주 책임 <strong>조찬희</strong>, 데이터·제안요청서 교차 <strong>기경현</strong>. 원문은 md, 제출본은 docx/xlsx.</p>
      </div>
    </section>

    <section class="slide" data-title="작성 방식">
      <div class="slide-inner">
        <p class="eyebrow">How we wrote</p>
        <h2>앞에서 뒤로만 내려가게 썼다</h2>
        <div class="chain">
          <b>제안요청서</b><i>→</i>
          <b>정의서</b><i>왜·범위</i>
          <b>대응표</b><i>39건</i>
          <b>요구사항</b><i>무엇을</i>
          <b>유스케이스</b><i>누가</i>
          <b>백로그</b><i>언제</i>
        </div>
        <div class="grid two">
          <div class="card">
            <h3>작성 원칙</h3>
            <ul>
              <li>한 ID에 검증 가능한 요구 하나</li>
              <li>모든 요구에 수용 기준</li>
              <li>제안요청서 번호와 우리 요구를 연결</li>
              <li>원본 수신은 덮지 않는다고 반복</li>
            </ul>
          </div>
          <div class="card">
            <h3>수업으로 자른 방식</h3>
            <ul>
              <li>전국·센터망 → 인천 표본·공개 API</li>
              <li>신호기 실제어는 제외, 현장은 요청만</li>
              <li>발주 행정 15건은 문서·수업 대체</li>
              <li>UTIC 미승인은 시드·수동 계획으로 대체</li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <section class="slide" data-title="문서별">
      <div class="slide-inner">
        <p class="eyebrow">Per document</p>
        <h2>각 산출물을 이렇게 채웠다</h2>
        <div class="grid two">
          <div class="card">
            <h3>프로젝트정의서</h3>
            <p>공단 제안요청서를 수업 범위로 줄였다. 수집→검지→관제→통제, 원본은 안 덮음, 실시간 API와 계획 데이터 대체 경로를 적었다.</p>
          </div>
          <div class="card">
            <h3>제안요청서 대응표</h3>
            <p>요청 39건을 빠짐없이 구현 / 부분 구현 / 문서만으로 나눴다. 프로그램으로 다루는 것은 24건이다.</p>
          </div>
          <div class="card">
            <h3>요구사항정의서</h3>
            <p>무엇을 만들지 ID로 쪼개고, 테스트로 통과·실패를 가릴 수 있게 적었다. 통제는 정보·계획·현장 요청으로 나눴다.</p>
          </div>
          <div class="card">
            <h3>유스케이스 · 백로그</h3>
            <p>흐름 11개, 구현 단위 33개로 나눴다. 필수 29개를 15주 일정에 넣었다.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="slide" data-title="다음 주">
      <div class="slide-inner">
        <p class="eyebrow">Next week · 4주차</p>
        <h2>다음 주 할 일과 산출물</h2>
        <table>
          <thead>
            <tr>
              <th>할 일</th>
              <th>산출물</th>
              <th>담당</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>프론트·백엔드 스택 확정, 논리 구성도</td>
              <td>아키텍처 1장</td>
              <td>공동</td>
            </tr>
            <tr>
              <td>표본 교차로 수 × 수집 주기 × 보관</td>
              <td>용량 산정</td>
              <td>기경현</td>
            </tr>
            <tr>
              <td>필수 6화면 IA · 와이어</td>
              <td>화면설계</td>
              <td>조찬희</td>
            </tr>
            <tr>
              <td>원본/제공 분리한 개념·논리 ERD</td>
              <td>ERD 초안</td>
              <td>기경현</td>
            </tr>
          </tbody>
        </table>
        <p class="note" style="margin-top:18px;">화면은 대시보드, 교차로 상세, 오류·이슈, 신호 계획, 통계, 설정. 아직 클릭 프로토타입은 5주차 산출이다.</p>
      </div>
    </section>

    <section class="slide" data-title="이후·미결">
      <div class="slide-inner">
        <p class="eyebrow">Lookahead · Issues</p>
        <h2>5주차 산출물과 아직 안 정한 것</h2>
        <div class="grid two">
          <div class="card">
            <h3>5주 말까지 나올 것</h3>
            <ul>
              <li>REST API 명세서</li>
              <li>검증 규칙 명세서 (R01–R12 임계)</li>
              <li>핵심 3화면 프로토타입</li>
              <li>설계 리뷰 기록 · 미정 항목 확정</li>
            </ul>
            <p style="margin-top:10px;">5주까지 정할 것: 기술 선택, 교차로 몇 개·얼마나 자주, 계획 데이터 대체, 실시간 푸시·지도, 오류 판정 숫자.</p>
          </div>
          <div class="card">
            <h3>아직 안 정한 것</h3>
            <ul>
              <li>React/Vue, Spring/Node</li>
              <li>인천 표본 수·수집 주기</li>
              <li>UTIC 승인 · ID 매핑 · 승인 전 대체</li>
              <li>웹소켓·지도 1차 포함 여부</li>
              <li>규칙 임계 기본값, 통제 화면 위치</li>
            </ul>
            <p class="owner" style="margin-top:10px;">UTIC(신호 계획 데이터) 승인이 늦어도 결함이 아니다. 직접 넣은 계획으로 진행한다.</p>
          </div>
        </div>
      </div>
    </section>
  </template>

  <script>
    const deck = document.getElementById("deck");
    const tpl = document.getElementById("slides");
    const slides = Array.from(tpl.content.querySelectorAll(".slide"));
    slides.forEach((s) => deck.appendChild(s));

    let i = 0;
    const total = slides.length;
    document.getElementById("total").textContent = String(total);

    function go(n) {
      i = Math.max(0, Math.min(total - 1, n));
      slides.forEach((s, idx) => s.classList.toggle("active", idx === i));
      document.getElementById("pos").textContent = String(i + 1);
      document.getElementById("bar").style.width = ((i + 1) / total) * 100 + "%";
      history.replaceState(null, "", "#" + (i + 1));
    }

    function fromHash() {
      const n = parseInt(location.hash.replace("#", ""), 10);
      go(Number.isFinite(n) ? n - 1 : 0);
    }

    document.getElementById("prev").onclick = () => go(i - 1);
    document.getElementById("next").onclick = () => go(i + 1);

    window.addEventListener("keydown", (e) => {
      if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) {
        e.preventDefault();
        go(i + 1);
      }
      if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) {
        e.preventDefault();
        go(i - 1);
      }
      if (e.key === "Home") go(0);
      if (e.key === "End") go(total - 1);
    });

    let touchX = null;
    window.addEventListener("touchstart", (e) => { touchX = e.changedTouches[0].clientX; });
    window.addEventListener("touchend", (e) => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (dx < -40) go(i + 1);
      if (dx > 40) go(i - 1);
      touchX = null;
    });

    window.addEventListener("hashchange", fromHash);
    fromHash();
  </script>
</body>
</html>
