<!DOCTYPE html>
<html lang="ko" data-base="../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal Guard — 11주차 주간 보고</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="deck.css?v=dl1" />
  <style>
    .slide.shot { padding: 0; background: #070b14; }
    .slide.shot img { width: 100%; height: 100%; object-fit: contain; background: #070b14; }
  </style>
</head>
<body class="deck-page">
  <div class="stage">
    <header class="top">
      <a class="brand" href="../index.html">
        <div class="lamps" aria-hidden="true">
          <i class="lamp red"></i><i class="lamp amber"></i><i class="lamp green"></i>
        </div>
        <div>
          <strong>Signal Guard</strong>
          <span>실시간 교통신호 상태정보 오류검지</span>
        </div>
      </a>
      <div class="meta">
        <span>11주차 주간 보고</span>
        <a class="ghost" href="../index.html">목록</a>
      </div>
    </header>
    <main id="deck"></main>
    <footer class="bar">
      <button class="nav-btn" id="prev" type="button">이전</button>
      <div class="progress"><i id="bar"></i></div>
      <div class="hint"><span id="pos">1</span> / <span id="total">0</span> · 방향키</div>
      <button class="nav-btn" id="next" type="button">다음</button>
    </footer>
  </div>

  <template id="slides">
    <section class="slide shot" data-title="표지"><img src="w11/01.png?v=w11b" alt="11주차 주간 보고 표지" /></section>
    <section class="slide shot" data-title="목차"><img src="w11/02.png?v=w11b" alt="목차" /></section>
    <section class="slide shot" data-title="이번 주 목표"><img src="w11/03.png?v=w11b" alt="이번 주 목표" /></section>
    <section class="slide shot" data-title="계획 대비 결과"><img src="w11/04.png?v=w11b" alt="계획 대비 결과" /></section>
    <section class="slide shot" data-title="반복 검증"><img src="w11/05.png?v=w11b" alt="동일 판정 검증" /></section>
    <section class="slide shot" data-title="이슈 흐름"><img src="w11/06.png?v=w11c" alt="이슈 흐름" /></section>
    <section class="slide shot" data-title="다음 주"><img src="w11/07.png?v=w11b" alt="다음 계획" /></section>
    <section class="slide shot" data-title="마무리"><img src="w11/08.png?v=w11b" alt="감사합니다" /></section>
  </template>

  <script src="vendor/marked.min.js"></script>
  <script src="docs.js?v=w11b"></script>
  <script src="deck.js"></script>
</body>
</html>
