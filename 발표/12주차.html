<!DOCTYPE html>
<html lang="ko" data-base="../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal Guard — 12주차 주간 보고</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="deck.css?v=dl1" />
  <style>
    .slide.shot { padding: 0; background: #070b14; }
    .slide.shot img { width: 100%; height: 100%; object-fit: contain; background: #070b14; }
  </style>
</head>
<body class="deck-page">
  <div class="stage">
    <header class="top">
      <a class="brand" href="../index.html">
        <div class="lamps" aria-hidden="true">
          <i class="lamp red"></i><i class="lamp amber"></i><i class="lamp green"></i>
        </div>
        <div>
          <strong>Signal Guard</strong>
          <span>실시간 교통신호 상태정보 오류검지</span>
        </div>
      </a>
      <div class="meta">
        <span>12주차 주간 보고</span>
        <a class="ghost" href="../index.html">목록</a>
      </div>
    </header>
    <main id="deck"></main>
    <footer class="bar">
      <button class="nav-btn" id="prev" type="button">이전</button>
      <div class="progress"><i id="bar"></i></div>
      <div class="hint"><span id="pos">1</span> / <span id="total">0</span> · 방향키</div>
      <button class="nav-btn" id="next" type="button">다음</button>
    </footer>
  </div>

  <template id="slides">
    <section class="slide shot" data-title="표지"><img src="w12/01.png?v=w12h" alt="12주차 주간 보고 표지" /></section>
    <section class="slide shot" data-title="목차"><img src="w12/02.png?v=w12h" alt="목차" /></section>
    <section class="slide shot" data-title="목표"><img src="w12/03.png?v=w12h" alt="오류 검지 통합 시험 목표" /></section>
    <section class="slide shot" data-title="이번 주 진행"><img src="w12/04.png?v=w12h" alt="이번 주 진행" /></section>
    <section class="slide shot" data-title="검지 결과"><img src="w12/05.png?v=w12h" alt="검지 결과" /></section>
    <section class="slide shot" data-title="배포와 범위"><img src="w12/06.png?v=w12h" alt="배포와 시연 범위" /></section>
    <section class="slide shot" data-title="다음 주"><img src="w12/07.png?v=w12h" alt="다음 계획" /></section>
    <section class="slide shot" data-title="마무리"><img src="w12/08.png?v=w12h" alt="감사합니다" /></section>
  </template>

  <script src="vendor/marked.min.js"></script>
  <script src="docs.js?v=w12h"></script>
  <script src="deck.js"></script>
</body>
</html>
