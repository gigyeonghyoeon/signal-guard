    <section class="slide" data-title="산출물">

        <table>

            <tr><td>프로젝트정의서</td><td>왜 만드는가, 범위, 데이터에 대한 정의</td><td>수업 MVP</td></tr>
            <tr><td>제안요청서 요구사항 대응표</td><td>공단 요청 39건을 수업에서 어디에 붙일지</td><td>구현 7 / 부분 17</td></tr>

      <div class="slide-inner">

        <h1>작성 방법</h1>
        <div class="grid two">
          <div class="card">
            <h3>작성 원칙</h3>
            <ul>
              <li>요구사항 별로 ID를 부여, 정의</li>
              <li>요구사항에 통과 기준 정의</li>
              <li>제안요청서의 내용을 토대로 요구사항을 연결</li>
            </ul>
          </div>
          <div class="card">

            <ul>
              <li>신호 데이터는 인천시 데이터로 제한</li>
              <li>제안요청서 중 실제 개발 범위 정의</li>
              <li>수업범위 내에서 산출물 정의</li>
            </ul>
          </div>
        </div>
      </div>

        <p class="eyebrow">Per document</p>

        <div class="grid two">
          <div class="card">
            <h3>프로젝트정의서</h3>
            <p>공단 제안요청서를 수업 범위로 줄였다. 수집→검지→관제→통제, 실시간 API와 계획 데이터의 대조.</p>
          </div>
          <div class="card">
            <h3>제안요청서 대응표</h3>
            <p>요청 39건 중 구현하는 부분은 24건.</p>
          </div>
          <div class="card">
            <h3>요구사항정의서</h3>
            <p>무엇을 만들지 ID로 쪼개고, 테스트로 통과·실패를 가릴 수 있게 적었다. 통제는 정보·계획·현장 요청으로 나눴다.</p>
          </div>
          <div class="card">
            <h3>유스케이스 · 백로그</h3>
            <p>흐름 11개, 구현 단위 33개. 백로그를 15주 일정에 따라 분배.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="slide" data-title="다음 주">

            <tr><td>표본 교차로 수 × 수집 주기 × 보관</td><td>기경현</td></tr>
            <tr><td>필수 화면 IA · 와이어</td><td>조찬희</td></tr>
            <tr><td>개념·논리 ERD</td><td>기경현</td></tr>
          </tbody>
        </table>

        <div class="grid two">
          <div class="card"><h3>API 명세서</h3><p>화면이 서버에 무엇을 요청하는지 적어 둔다.</p></div>
          <div class="card"><h3>검증 규칙 명세서</h3><p>어떤 신호를 오류로 볼지 규칙을 적는다.</p></div>

          <div class="card"><h3>설계 리뷰</h3><p>4–5주 설계를 한 번 점검하고 구현으로 넘어간다.</p></div>
        </div>
