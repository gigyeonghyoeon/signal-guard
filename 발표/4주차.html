            <p>구현 + 부분 구현 = 24건. 기능 5건은 구현 또는 부분 구현.</p>
            <p>바꾸지 않음: 원본 불변, 검지→관제→통제, 실제어 제외.</p>

    <section class="slide" data-title="백로그">
      <div class="slide-inner">
        <p class="eyebrow">Analysis · 제품 백로그 · WBS</p>
        <h2>언제, 누가, 얼마나</h2>
        <p class="note" style="margin-bottom:14px">스토리 문구는 유스케이스 문서가 정본이고, 이 문서는 배치·용량·작업 패키지만 고정합니다.</p>
        <div class="grid two">
          <div class="card">
            <h3>백로그</h3>
            <p>필수 스토리 29건 = 96 스토리 포인트. 구현 6주 × 주당 16과 같습니다.</p>
            <p>중요·선택(UTIC 수집, 지도, 웹소켓)은 버퍼에만 넣습니다.</p>
            <p>완료의 정의에 ‘원본 수신을 덮어쓰는 경로가 없다’를 넣었습니다.</p>
            <p>자르지 않는 것: 수집, 규칙 엔진, 자동보정/이슈, 대시보드, 세 갈래 통제, 로그인, 쿼터.</p>
          </div>
          <div class="card">
            <h3>WBS</h3>
            <p>분석 1–3주 S0 — 산출물 5종. M1 통과.</p>
            <p>설계 4–5주 S-D1, S-D2 — 지금 여기.</p>
            <p>구현 6–11주 S1–S6 — 11주 말 기능 동결(M5).</p>
            <p>테스트 12–13주 — 필수 테스트 100%. 안정화 14–15주 — 매뉴얼·시연.</p>
            <p>조찬희는 화면·일정, 기경현은 수집·엔진·DB. 스토리에 FE/BE가 같이 있으면 둘 다 Done이어야 합니다.</p>
          </div>
        </div>
      </div>
    </section>

          <div class="card"><h3>화면 프로토타입</h3><p>필수 3화면을 클릭해 관제 루프를 따라갑니다. 화면 ID는 SCR-DASH, SCR-INT-DETAIL, SCR-ISS입니다.</p></div>
