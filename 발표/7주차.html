<!DOCTYPE html>
<html lang="ko" data-base="../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal Guard — 7주차 주간 보고</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="deck.css?v=dl1" />
  <style>
    .slide.shot { padding: 0; background: #070b14; }
    .slide.shot img { width: 100%; height: 100%; object-fit: contain; background: #070b14; }
  </style>
</head>
<body class="deck-page">
  <div class="stage">
    <header class="top">
      <a class="brand" href="../index.html">
        <div class="lamps" aria-hidden="true">
          <i class="lamp red"></i><i class="lamp amber"></i><i class="lamp green"></i>
        </div>
        <div>
          <strong>Signal Guard</strong>
          <span>실시간 교통신호 상태정보 오류검지</span>
        </div>
      </a>
      <div class="meta">
        <span>7주차 주간 보고</span>
        <a class="ghost" href="../index.html">목록</a>
      </div>
    </header>
    <main id="deck"></main>
    <footer class="bar">
      <button class="nav-btn" id="prev" type="button">이전</button>
      <div class="progress"><i id="bar"></i></div>
      <div class="hint"><span id="pos">1</span> / <span id="total">0</span> · 방향키</div>
      <button class="nav-btn" id="next" type="button">다음</button>
    </footer>
  </div>

  <template id="slides">
    <section class="slide shot" data-title="표지"><img src="w7/01.png?v=rev" alt="7주차 주간 보고 표지" /></section>
    <section class="slide shot" data-title="이번주"><img src="w7/02.png?v=rev" alt="이번주" /></section>
    <section class="slide shot" data-title="5주차 변경사항"><img src="w7/03.png?v=rev" alt="5주차 변경사항" /></section>
    <section class="slide shot" data-title="오류 발생 상황 분류"><img src="w7/04.png?v=rev" alt="오류 발생 상황 분류" /></section>
    <section class="slide shot" data-title="문서 작성 방법"><img src="w7/05.png?v=rev" alt="문서 작성 방법" /></section>
    <section class="slide shot" data-title="오류 상황 예시"><img src="w7/06.png?v=rev" alt="오류 상황 예시" /></section>
    <section class="slide shot" data-title="자동 보정 가능 상황"><img src="w7/07.png?v=rev" alt="자동 보정 가능 상황" /></section>
    <section class="slide shot" data-title="자동 보정 불가 상황"><img src="w7/08.png?v=rev" alt="자동 보정 불가 상황" /></section>
    <section class="slide shot" data-title="다음 주 할 일"><img src="w7/09.png?v=rev" alt="다음 주 할 일" /></section>
    <section class="slide shot" data-title="질의응답"><img src="w7/10.png?v=rev" alt="질의응답" /></section>
  </template>

  <script src="vendor/marked.min.js"></script>
  <script src="docs.js?v=w7b"></script>
  <script src="deck.js"></script>
</body>
</html>
